# Builds the web app image and deploys it to Azure Container Apps.
# Runs when anything under web/ changes on main (code or the data snapshot), or by hand
# (Actions tab > deploy > Run workflow).
#   1. test:   the web snapshot tests, so a broken app or data file never ships
#   2. build:  web/Dockerfile.cloud -> ghcr.io/isaacmccalla/aviation-dashboard (GitHub's free registry)
#   3. deploy: points the Container App at the new image. Skipped until the repository variables
#              below exist (Settings > Secrets and variables > Actions > Variables). Signs in to Azure
#              with OpenID Connect, so no password or key is stored in GitHub.
#              AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, AZURE_CONTAINERAPP
#              Set up by deploy/link_github_to_azure.ps1. If azure/login fails with AADSTS700213, the
#              federated credential's subject doesn't match the token (see the script's header).
name: deploy

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/isaacmccalla/aviation-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r web/requirements.txt -r requirements-dev.txt
      - run: pytest tests/test_web_snapshot.py -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile.cloud
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    if: vars.AZURE_CONTAINERAPP != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job prove to Azure it is this repository's workflow (OpenID Connect)
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the Container App at the new image
        run: >
          az containerapp update
          --name ${{ vars.AZURE_CONTAINERAPP }}
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ${{ env.IMAGE }}:${{ github.sha }}
